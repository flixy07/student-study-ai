<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Study Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f2f5f9;

            margin: 0;

            color: #222;
        }


        /* ==================================================
           CHAT HISTORY SIDEBAR
           ================================================== */

        .history-panel {

            position: fixed;

            left: 0;

            top: 0;

            width: 280px;

            height: 100vh;

            background: white;

            border-right: 1px solid #ddd;

            padding: 20px;

            overflow-y: auto;

            z-index: 1000;
        }


        .history-title {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .clear-history {

            width: 100%;

            padding: 10px;

            margin-bottom: 15px;

            background: #222;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;
        }


        .clear-history:hover {

            background: #444;
        }


        .history-item {

            padding: 12px;

            margin-bottom: 8px;

            background: #f3f3f3;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            line-height: 1.4;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .history-item:hover {

            background: #e5e5e5;
        }


        /* ==================================================
           MAIN CONTENT
           ================================================== */

        .main-content {

            margin-left: 280px;
        }


        /* ==================================================
           HEADER
           ================================================== */

        .header {

            background: #222;

            color: white;

            padding: 35px;

            text-align: center;
        }


        .header h1 {

            font-size: 40px;

            margin: 0 0 15px 0;
        }


        .header p {

            font-size: 20px;

            margin: 0;
        }


        /* ==================================================
           CONTAINER
           ================================================== */

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 40px auto;
        }


        /* ==================================================
           MAIN BOX
           ================================================== */

        .box {

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 2px 15px #ccc;
        }


        .box h2 {

            font-size: 30px;
        }


        textarea {

            width: 100%;

            height: 150px;

            padding: 15px;

            font-size: 18px;

            box-sizing: border-box;

            border: 1px solid #aaa;

            border-radius: 8px;

            resize: vertical;
        }


        .main-button {

            margin-top: 15px;

            padding: 14px 30px;

            background: #222;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 17px;
        }


        .main-button:hover {

            background: #444;
        }


        /* ==================================================
           ANSWER
           ================================================== */

        #answer {

            margin-top: 25px;

            padding: 20px;

            background: #f5f5f5;

            border-radius: 8px;

            font-size: 17px;

            line-height: 1.6;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }


        /* ==================================================
           FEATURES
           ================================================== */

        .features {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-top: 25px;
        }


        .feature {

            padding: 25px;

            background: white;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 2px 10px #ddd;

            cursor: pointer;

            transition: 0.2s;
        }


        .feature:hover {

            transform: translateY(-5px);

            box-shadow: 0 5px 15px #ccc;
        }


        .feature-icon {

            font-size: 45px;
        }


        .feature h3 {

            font-size: 22px;
        }


        .feature p {

            font-size: 16px;
        }


        /* ==================================================
           QUIZ
           ================================================== */

        .quiz-container {

            margin-top: 20px;
        }


        .quiz-question {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border-radius: 10px;

            box-shadow: 0 2px 8px #ddd;
        }


        .quiz-question h3 {

            margin-top: 0;
        }


        .quiz-option {

            display: block;

            width: 100%;

            text-align: left;

            margin: 8px 0;

            padding: 12px;

            background: #f2f2f2;

            color: #222;

            border: 1px solid #ccc;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }


        .quiz-option:hover {

            background: #e5e5e5;
        }


        .correct {

            background: #c8f7c5 !important;

            border-color: green !important;
        }


        .wrong {

            background: #ffcaca !important;

            border-color: red !important;
        }


        .score {

            font-size: 24px;

            font-weight: bold;

            padding: 20px;

            background: white;

            border-radius: 10px;

            margin-top: 20px;
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 800px) {

            .history-panel {

                position: relative;

                width: 100%;

                height: auto;

                border-right: none;

                border-bottom: 1px solid #ddd;
            }


            .main-content {

                margin-left: 0;
            }


            .features {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 500px) {

            .features {

                grid-template-columns: 1fr;
            }


            .container {

                width: 95%;
            }


            .header h1 {

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<!-- ======================================================
     CHAT HISTORY
     ====================================================== -->

<div class="history-panel">

    <div class="history-title">
        💬 Chat History
    </div>


    <button
        class="clear-history"
        onclick="clearHistory()"
    >
        🗑️ Clear History
    </button>


    <div id="historyList">

        <p>
            Loading history...
        </p>

    </div>

</div>


<!-- ======================================================
     MAIN CONTENT
     ====================================================== -->

<div class="main-content">


    <!-- HEADER -->

    <div class="header">

        <h1>
            🤖 AI Study Assistant
        </h1>

        <p>
            Your Personal AI Study Agent
        </p>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- ASK AI -->

        <div class="box">

            <h2>
                Ask your Study Agent
            </h2>


            <textarea
                id="question"
                placeholder="Example: Explain polymorphism in Java..."
            ></textarea>


            <br>


            <button
                class="main-button"
                onclick="askAI()"
            >
                🤖 Ask AI
            </button>


            <div id="answer"></div>

        </div>


        <!-- FEATURES -->

        <div class="features">


            <!-- EXPLAIN -->

            <div
                class="feature"
                onclick="explainTopic()"
            >

                <div class="feature-icon">
                    📖
                </div>

                <h3>
                    Explain
                </h3>

                <p>
                    Understand difficult topics
                </p>

            </div>


            <!-- QUIZ -->

            <div
                class="feature"
                onclick="generateQuiz()"
            >

                <div class="feature-icon">
                    ❓
                </div>

                <h3>
                    Quiz
                </h3>

                <p>
                    Generate practice questions
                </p>

            </div>


            <!-- NOTES -->

            <div
                class="feature"
                onclick="createNotes()"
            >

                <div class="feature-icon">
                    📝
                </div>

                <h3>
                    Notes
                </h3>

                <p>
                    Create simple study notes
                </p>

            </div>


            <!-- STUDY PLAN -->

            <div
                class="feature"
                onclick="createStudyPlan()"
            >

                <div class="feature-icon">
                    📅
                </div>

                <h3>
                    Study Plan
                </h3>

                <p>
                    Create a study schedule
                </p>

            </div>

        </div>

    </div>

</div>


<!-- ======================================================
     JAVASCRIPT
     ====================================================== -->

<script>


// ========================================================
// GET TOPIC
// ========================================================

function getTopic() {

    const topic =
        document
        .getElementById("question")
        .value
        .trim();


    if (topic === "") {

        alert(
            "Please enter a topic first."
        );

        return null;
    }


    return topic;
}


// ========================================================
// DISPLAY ANSWER
// ========================================================

function displayAnswer(
    title,
    text
) {

    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML = "";


    const heading =
        document.createElement(
            "h2"
        );


    heading.textContent =
        title;


    const content =
        document.createElement(
            "div"
        );


    content.textContent =
        text;


    answer.appendChild(
        heading
    );


    answer.appendChild(
        content
    );
}


// ========================================================
// ASK AI
// ========================================================

async function askAI() {

    const question =
        getTopic();


    if (!question) {

        return;
    }


    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML =
        "<p>🤖 Thinking...</p>";


    try {

        const response =
            await fetch(
                "/ask",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question:
                            question
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.answer ||
                "Server error"
            );
        }


        displayAnswer(
            "🤖 AI Response",
            data.answer
        );


        // Refresh sidebar

        loadHistory();


    } catch (error) {

        console.error(error);


        answer.innerHTML =
            "<p>❌ " +
            error.message +
            "</p>";
    }

}


// ========================================================
// EXPLAIN
// ========================================================

async function explainTopic() {

    const topic =
        getTopic();


    if (!topic) {

        return;
    }


    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML =
        "<p>📖 Creating explanation...</p>";


    try {

        const response =
            await fetch(
                "/explain",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        topic:
                            topic
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.answer ||
                "Server error"
            );
        }


        displayAnswer(
            "📖 Explanation",
            data.answer
        );


    } catch (error) {

        answer.innerHTML =
            "<p>❌ " +
            error.message +
            "</p>";
    }

}


// ========================================================
// QUIZ
// ========================================================

async function generateQuiz() {

    const topic =
        getTopic();


    if (!topic) {

        return;
    }


    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML =
        "<p>❓ Generating quiz...</p>";


    try {

        const response =
            await fetch(
                "/quiz",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        topic:
                            topic
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.answer ||
                "Server error"
            );
        }


        displayQuiz(
            data.answer
        );


    } catch (error) {

        answer.innerHTML =
            "<p>❌ " +
            error.message +
            "</p>";
    }

}


// ========================================================
// PARSE QUIZ
// ========================================================

function parseQuiz(text) {

    const questions = [];


    const blocks =
        text.split(
            /QUESTION\s+\d+\s*:/i
        );


    for (
        let i = 1;
        i < blocks.length;
        i++
    ) {

        const block =
            blocks[i];


        const lines =
            block
            .split("\n")
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


        if (
            lines.length < 6
        ) {

            continue;
        }


        const question =
            lines[0];


        const options = [];


        for (
            const letter of
            ["A", "B", "C", "D"]
        ) {

            const optionLine =
                lines.find(
                    line =>
                        line
                        .toUpperCase()
                        .startsWith(
                            letter + ")"
                        )
                );


            if (optionLine) {

                options.push({

                    letter:
                        letter,

                    text:
                        optionLine
                        .substring(2)
                        .trim()

                });

            }

        }


        const answerLine =
            lines.find(
                line =>
                    line
                    .toUpperCase()
                    .startsWith(
                        "ANSWER:"
                    )
            );


        const correctAnswer =
            answerLine
            ? answerLine
                .substring(7)
                .trim()
                .charAt(0)
                .toUpperCase()
            : "";


        const explanationIndex =
            lines.findIndex(
                line =>
                    line
                    .toUpperCase()
                    .startsWith(
                        "EXPLANATION:"
                    )
            );


        let explanation = "";


        if (
            explanationIndex !== -1
        ) {

            explanation =
                lines
                .slice(
                    explanationIndex
                )
                .join(" ")
                .replace(
                    /^EXPLANATION:\s*/i,
                    ""
                );

        }


        if (
            question &&
            options.length === 4 &&
            correctAnswer
        ) {

            questions.push({

                question:
                    question,

                options:
                    options,

                answer:
                    correctAnswer,

                explanation:
                    explanation,

                answered:
                    false

            });

        }

    }


    return questions;
}


// ========================================================
// DISPLAY QUIZ
// ========================================================

function displayQuiz(text) {

    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML = "";


    const title =
        document.createElement(
            "h2"
        );


    title.textContent =
        "❓ Practice Quiz";


    answer.appendChild(
        title
    );


    const questions =
        parseQuiz(text);


    if (
        questions.length === 0
    ) {

        const fallback =
            document.createElement(
                "div"
            );


        fallback.textContent =
            text;


        answer.appendChild(
            fallback
        );


        return;
    }


    let score = 0;


    const scoreBox =
        document.createElement(
            "div"
        );


    scoreBox.className =
        "score";


    scoreBox.textContent =
        "Score: 0 / " +
        questions.length;


    answer.appendChild(
        scoreBox
    );


    questions.forEach(
        (question, index) => {

            const questionBox =
                document.createElement(
                    "div"
                );


            questionBox.className =
                "quiz-question";


            const heading =
                document.createElement(
                    "h3"
                );


            heading.textContent =
                `${index + 1}. ` +
                question.question;


            questionBox.appendChild(
                heading
            );


            question.options.forEach(
                option => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "quiz-option";


                    button.textContent =
                        option.letter +
                        ") " +
                        option.text;


                    button.onclick =
                        function() {

                            if (
                                question.answered
                            ) {

                                return;
                            }


                            question.answered =
                                true;


                            if (
                                option.letter ===
                                question.answer
                            ) {

                                button.classList
                                    .add(
                                        "correct"
                                    );


                                score++;


                            } else {

                                button.classList
                                    .add(
                                        "wrong"
                                    );


                                const buttons =
                                    questionBox
                                    .querySelectorAll(
                                        ".quiz-option"
                                    );


                                buttons.forEach(
                                    otherButton => {

                                        if (
                                            otherButton
                                            .dataset
                                            .letter ===
                                            question.answer
                                        ) {

                                            otherButton
                                                .classList
                                                .add(
                                                    "correct"
                                                );

                                        }

                                    }
                                );

                            }


                            scoreBox.textContent =
                                "Score: " +
                                score +
                                " / " +
                                questions.length;


                            if (
                                score ===
                                questions.length
                            ) {

                                scoreBox.textContent +=
                                    " 🎉 Perfect score!";

                            }

                        };


                    button.dataset.letter =
                        option.letter;


                    questionBox.appendChild(
                        button
                    );

                }
            );


            answer.appendChild(
                questionBox
            );

        }
    );

}


// ========================================================
// NOTES
// ========================================================

    const topic =

    const answer =

}

// ========================================================
// LOAD HISTORY
// ========================================================

async function loadHistory() {

    try {

        const response =
            await fetch(
                "/history"
            );


        const data =
            await response.json();


        const historyList =
            document.getElementById(
                "historyList"
            );


        historyList.innerHTML = "";


        if (
            data.history.length === 0
        ) {

            historyList.innerHTML =
                "<p>No chats yet.</p>";

            return;
        }


        data.history.forEach(
            chat => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.textContent =
                    chat.question;


                item.title =
                    chat.question;


                item.onclick =
                    function() {

                        showPreviousChat(
                            chat
                        );

                    };


                historyList.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(
            "Could not load history:",
            error
        );

    }

}


// ========================================================
// SHOW OLD CHAT
// ========================================================

function showPreviousChat(chat) {

    const answer =
        document.getElementById(
            "answer"
        );


    answer.innerHTML = "";


    const questionTitle =
        document.createElement(
            "h3"
        );


    questionTitle.textContent =
        "👤 You";


    const question =
        document.createElement(
            "p"
        );


    question.textContent =
        chat.question;


    const answerTitle =
        document.createElement(
            "h3"
        );


    answerTitle.textContent =
        "🤖 AI Study Assistant";


    const aiAnswer =
        document.createElement(
            "div"
        );


    aiAnswer.textContent =
        chat.answer;


    answer.appendChild(
        questionTitle
    );


    answer.appendChild(
        question
    );


    answer.appendChild(
        answerTitle
    );


    answer.appendChild(
        aiAnswer
    );


    document.getElementById(
        "question"
    ).value =
        chat.question;

}


// ========================================================
// CLEAR HISTORY
// ========================================================

async function clearHistory() {

    const confirmed =
        confirm(
            "Are you sure you want to delete all chat history?"
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(
                "/clear-history",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        alert(
            data.message
        );


        document.getElementById(
            "answer"
        ).innerHTML = "";


        loadHistory();


    } catch (error) {

        console.error(error);


        alert(
            "Could not clear history."
        );

    }

}


// ========================================================
// LOAD HISTORY WHEN PAGE OPENS
// ========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadHistory();

    }
);


</script>


</body>

</html>
